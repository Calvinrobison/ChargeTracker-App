# electron-builder configuration.
#
# The choices here that matter for this product:
#
#  * A FULL NSIS installer, not a web installer. The bundled browser is large
#    and must be present offline; a web installer would download at first run,
#    which is exactly what the product promises not to do.
#  * Per-user install with no administrator rights, so a nondeveloper can run
#    it without a prompt they cannot satisfy.
#  * The Chromium payload ships as `resources/browser/`, OUTSIDE app.asar, and
#    is resolved from `process.resourcesPath`. Nothing depends on the builder's
#    home cache, which does not exist on a user's machine.
#  * There is NO native module. SQLite comes from `node:sqlite`, which Electron
#    already ships, so nothing has to be rebuilt for the Electron ABI and
#    nothing has to be unpacked from the asar.
#  * `publish` is set but release CI passes `--publish never`; publication is a
#    separate, authorised step (see docs/RELEASING.md).

appId: com.formicaria.chargewatch
productName: ChargeWatch
copyright: © 2026 Calvin Robison

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  - '!node_modules/**/test/**'
  - '!node_modules/**/*.md'

# Nothing needs unpacking from the asar. The bundled browser is already outside
# it via extraResources, and there is no native module.

extraResources:
  # Assembled by `npm run setup:browser`; see scripts/setup-browser.mjs. Not
  # committed to git — it is a large binary payload built reproducibly.
  - from: .playwright-cache/chromium
    to: browser
    filter:
      - '**/*'
  - from: resources/icons
    to: icons
    filter:
      - '**/*'
  - from: resources/catalog
    to: catalog
    filter:
      - '**/*'
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/icon.ico
  # Unsigned for now. Signing is a separate, authorised decision; see
  # docs/adr and docs/RELEASING.md. No fake publisher is configured.
  #
  # KNOWN ODDITY, not yet changed: with this true and no certificate present,
  # electron-builder still runs signtool.exe over every executable in the
  # output -- including the eleven Chromium binaries under resources/browser,
  # which Google already signed. Rewriting binaries we did not produce is
  # pointless work on a large payload and is worth stopping.
  #
  # It is left alone because the knob that disables it also disables the
  # resource editing that embeds our icon and version strings into
  # ChargeWatch.exe, and the packaging step currently succeeds. Narrowing it to
  # skip extraResources needs a custom sign hook, which should not be written
  # blind against a build that works. Tracked in docs/IMPLEMENTATION_STATUS.md.
  signAndEditExecutable: true
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  # Per-user, one-click, no administrator rights.
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ChargeWatch
  # Uninstalling KEEPS the user's history. Removing data is a separate,
  # explicit action, never a side effect of uninstalling.
  deleteAppDataOnUninstall: false

  # OFF, deliberately.
  #
  # Differential packaging embeds blockmap machinery so an update can download
  # only the changed blocks instead of the whole installer. That is worth
  # having -- but only when there is a PREVIOUS RELEASE to compute a delta
  # against, and there are none. Today it buys nothing and costs a more
  # complicated installer over a ~250 MB payload.
  #
  # An earlier revision of this comment guessed that differential packaging
  # was behind the STATUS_HEAP_CORRUPTION (-1073740940) the first installer
  # exited with. That guess was wrong, and the real cause is now established:
  # electron-builder ships a 32-BIT 7za.exe, which cannot address the ~700 MB
  # of LZMA encoder memory that -mx=9 needs on this payload. With
  # differentialPackage off, the build path changed enough that the same
  # failure surfaced honestly at build time -- "Can't allocate required
  # memory!" -- instead of producing an installer that crashed on use.
  # scripts/windows/build-all.ps1 now puts a 64-bit 7-Zip on PATH.
  #
  # So this setting is off on its own merits only: there is no previous
  # release to delta against. Turn it back on once one exists, and confirm the
  # installer still runs when you do.
  differentialPackage: false

publish:
  provider: github
  owner: Calvinrobison
  repo: ChargeTracker-App
  releaseType: release
  # Drafts and prereleases are ignored by the updater unless the channel says
  # otherwise; see src/main/updates-backend.ts.
  vPrefixedTagName: true

# The build must fail loudly rather than produce a package missing its browser.
afterPack: scripts/after-pack.mjs
