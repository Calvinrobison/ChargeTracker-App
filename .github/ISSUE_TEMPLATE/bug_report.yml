name: Bug report
description: Something behaves incorrectly, or shows a number you believe is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste your history database or an unredacted diagnostic bundle
        into a public issue.** The diagnostic bundle is redacted on export, but
        read it before attaching it.

        If the problem is that a number looks wrong, the two screens that
        usually explain it are the coverage indicator for the window and the
        **Data integrity** panel. A gap in coverage is reported as a gap on
        purpose — it is not counted as zero occupancy.

  - type: input
    id: version
    attributes:
      label: ChargeWatch version
      description: Settings → About, or the installer file name.
      placeholder: '0.1.0'
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: 'Run `winver`, or Settings → System → About.'
      placeholder: 'Windows 11 24H2'
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Map workspace
        2. Select the last 7 days
        3. …
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app
      options:
        - Numbers, metrics or rankings
        - Map or station list
        - Collection, scheduling or a data source
        - Import or export
        - Updates, backup or restore
        - Install or first run
        - Something else
    validations:
      required: true

  - type: textarea
    id: numbers
    attributes:
      label: If a number looks wrong, what does the coverage indicator say?
      description: >
        The window's coverage percentage and any warning banner text. A metric
        computed over partial coverage is labelled; that label is usually the
        answer, and if it is missing when it should be present, say so — that is
        a more serious bug than the number itself.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: >
        Settings → Diagnostics → Open log folder. Paste only the lines around
        the problem, and read them before pasting.
      render: text

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I have not pasted credentials, cookies, or an unredacted database.
          required: true
        - label: I searched existing issues.
          required: false
